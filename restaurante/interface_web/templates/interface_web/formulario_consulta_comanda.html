<form class="formulario-consulta" method="get" action="{% url url_consulta %}">
  <label for="identificador-comanda">Identificador da comanda</label>
  <input
    id="identificador-comanda"
    type="text"
    name="identificador"
    value="{{ identificador|default:'' }}"
    autocomplete="off"
    {% if foco_automatico_consulta %}autofocus{% endif %}
    required
  >
  <button type="submit">Consultar</button>
</form>
